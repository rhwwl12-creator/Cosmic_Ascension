GlobalDefaultGameMode=/Script/Cosmic_Ascension.CosmicGameMode

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1

; Cosmic Ascension: no Lumen. Emissive star spheres, lanes and a skybox need no GI/reflections.
; Mesh distance fields are read-only at startup and rebuild every static mesh when toggled, so decided now (zero meshes yet).
r.GenerateMeshDistanceFields=False

r.DynamicGlobalIlluminationMethod=0

r.ReflectionMethod=0

r.SkinCache.CompileShaders=False

; Cosmic Ascension: no ray tracing. The 3D scene is ~150 emissive spheres + lines; RT only adds shader permutations and GPU requirements.
r.RayTracing=False

r.RayTracing.RayTracingProxies.ProjectEnabled=False

; Substrate stays ON (UE 5.8 project-generator default). Decided 2026-10-10, before any material exists:
; turning it off later needs an editor restart and breaks materials authored with Substrate-only nodes.
; r.Substrate.ProjectGBufferFormat=0 = Blendable GBuffer (1 closure, 20 bytes/pixel, all platforms); 1 = Adaptive (heavier, multi-closure).
r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; Cosmic Ascension (2026-10-17, Phase 3 item 6): a map of unlit stars and thin lines wants none of motion blur, ambient
; occlusion or temporal anti-aliasing. Off-screen at 10x they took most of the GPU frame (motion blur alone about half),
; and a temporal method smears one-pixel lines. FXAA (1) instead of TSR (4).
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
r.AntiAliasingMethod=1


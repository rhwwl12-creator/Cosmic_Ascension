; Pending role effect (section 7.2 FCallingState.PendingEffect, 7.4 last tick stage). One to one with EEffectType::KillPlayer / DeposeRuler.
; An empty PendingEffect means nothing is pending, so these two must stay declared: an undeclared name requests an empty tag.
+GameplayTagList=(Tag="Effect.KillPlayer",DevComment="FCallingState.PendingEffect: the vessel dies at the tick boundary. Recorded by hazard expiry, event effects and encounter failure, never run in place.")
+GameplayTagList=(Tag="Effect.DeposeRuler",DevComment="FCallingState.PendingEffect: the player loses the throne at the tick boundary. Recorded, never run in place.")


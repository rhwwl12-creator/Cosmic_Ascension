; Cosmic Ascension - GameplayTag declarations (guideline.md section 10.1, 10.4).
; Rules: Domain.Sub.Leaf, max 3 levels. Tags are declared here and requested in code with
; FGameplayTag::RequestGameplayTag(FName("Hazard.PreSupernova")).
; DevComment is developer-facing only (ASCII). Player-facing names live in DataTables / String Tables.

; Format verified against UE 5.8.3 source (GameplayTagsSettings.h / GameplayTagsManager.cpp):
;  - this file is a config hierarchy layer, so every array row MUST start with '+' (a bare key would replace the array)
;  - loose per-system files under Config/Tags/*.ini use section [/Script/GameplayTags.GameplayTagsList] and bare rows WITHOUT '+'
;  - ImportTagsFromConfig defaults to true; kept explicit to document intent

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True

; ---- Hazards (section 4.1) -------------------------------------------------
+GameplayTagList=(Tag="Hazard.PreSupernova",DevComment="Pre-supernova star. 300 ticks. Unresolved: system destroyed, neighbours damaged.")
+GameplayTagList=(Tag="Hazard.AIAwakening",DevComment="Mining AI awakening. 150 ticks. Unresolved: 50% production +150% / 50% revolt.")
+GameplayTagList=(Tag="Hazard.Plague",DevComment="Interstellar plague. 200 ticks. Unresolved: population -40%, spreads to neighbours.")
+GameplayTagList=(Tag="Hazard.SubspaceErosion",DevComment="Subspace erosion. 400 ticks. Unresolved: lanes permanently cut.")
+GameplayTagList=(Tag="Hazard.Extinction",DevComment="Extinction crisis. 250 ticks. Unresolved: civilization deleted.")
+GameplayTagList=(Tag="Hazard.Cult",DevComment="Cult of a Fallen Transcendent appears. 350 ticks. Unresolved: system joins its sphere.")
+GameplayTagList=(Tag="Hazard.Rebellion",DevComment="Rebellion at the ruler's home system. 200 ticks. Spawns after Stability < 0.3 for 100 ticks (tick >= 300). Unresolved: DeposeRuler.")
+GameplayTagList=(Tag="Hazard.Claim",DevComment="Claim (soul economy). 300 ticks (CountdownTicks of the row crisis_claim). Placed by the claim rule right after another Hazard expires on a settled system within reach of an unsealed fallen sphere that does not hold it (under tribute: Phase 4). Resolved: nothing happens. Unresolved: the system joins the claimant's sphere. No saved scalar. Never on a civ's last unclaimed settled system (Law.Remnant). Section 4.1, 4.2.")
+GameplayTagList=(Tag="Hazard.Visitation",DevComment="Visitation (calling). 120 ticks. Not a crisis: unresolved means 'the time passed', no penalty. Section 4.5.")

; ---- Transcendent doctrines and allegiance (section 4.2) -------------------
; Four fallen doctrines are defined; at most 3 are active (unsealed) per run (DT_Rules.FallenTranscendentCount).
; Realm.* is the allegiance of a row (FTranscendentDef.Allegiance). It is definition data, never state.
+GameplayTagList=(Tag="Doctrine.Silence",DevComment="Fallen doctrine: suppresses civilization growth. Avatar of entropy. Counterfeit of Truth.Rest. Always active (VS 1 / EA fixed).")
+GameplayTagList=(Tag="Doctrine.Assimilation",DevComment="Fallen doctrine: absorbs civilizations into one. Counterfeit of Truth.Union. EA roster draw weight 2.")
+GameplayTagList=(Tag="Doctrine.Zeal",DevComment="Fallen doctrine: leaves only civilizations that worship it. Counterfeit of Truth.Worship. EA roster draw weight 3.")
+GameplayTagList=(Tag="Doctrine.Recurrence",DevComment="Fallen doctrine: the wheel. Reuses the same vessel and reaps again. Counterfeit of Truth.Renewal (resurrection and succession). Offers the return lure (enc_recurrence_return). Row is Phase 6+, draw weight 2. Section 4.2, 4.4.")
+GameplayTagList=(Tag="Doctrine.Covenant",DevComment="Celestial messenger (trans_covenant): visits instead of holding a sphere. Phase 6+ row, no state instance. Not counted against the fallen cap.")
+GameplayTagList=(Tag="Doctrine.Stillness",DevComment="Independent Transcendent trans_stillness. Not fallen, not counted against the cap, fixed sphere, no claims, no Hazard. Phase 6+ row; name fixed now because FTranscendentState.Doctrine is saved. Section 4.2, 4.5.")
+GameplayTagList=(Tag="Doctrine.Release",DevComment="Independent Transcendent trans_release. Not fallen, not counted against the cap, fixed sphere, no claims, no Hazard. Phase 6+ row; name fixed now because FTranscendentState.Doctrine is saved. Section 4.2, 4.5.")
+GameplayTagList=(Tag="Realm.Abyssal",DevComment="Allegiance: fallen Transcendent. Only allegiance that speaks in first person (Log.Transcendent, Log.Claim).")
+GameplayTagList=(Tag="Realm.Celestial",DevComment="Allegiance: celestial messenger. Visits instead of holding a sphere. No sphere, no pressure, no claims, no state instance. Phase 6+.")
+GameplayTagList=(Tag="Realm.Independent",DevComment="Allegiance: independent (non-fallen) Transcendent. Contemplates, spawns no Hazard, no claims, fixed sphere. Phase 6+.")

; ---- Counterfeit principle: the true thing each fallen doctrine imitates (section 4.2, FTranscendentDef.CounterfeitOf) --
+GameplayTagList=(Tag="Truth.Rest",DevComment="Rest (Heb 4:10, Rev 14:13). Counterfeited by Doctrine.Silence. Pointed at only by institutions (sabbath edict), never a number.")
+GameplayTagList=(Tag="Truth.Union",DevComment="One body with many members (1 Cor 12:14,20; Rev 7:9). Counterfeited by Doctrine.Assimilation. Names are kept, not erased.")
+GameplayTagList=(Tag="Truth.Worship",DevComment="Worship that goes up to the Maker and that even messengers refuse (Rev 19:10). Counterfeited by Doctrine.Zeal.")
+GameplayTagList=(Tag="Truth.Renewal",DevComment="Resurrection and succession (Rom 6:9, Rev 21:5). Counterfeited by Doctrine.Recurrence. Resurrection itself is not in the game; succession is.")

; ---- Tier 5 ways (section 3.2) ---------------------------------------------
+GameplayTagList=(Tag="Way.Received",DevComment="Received way: steward keeps the laws, seals, then lays rulership down. Ending 'Entrusted Eternity'.")
+GameplayTagList=(Tag="Way.Seized",DevComment="Seized way: absorbs Causality. Ending 'I will ascend'. Not game over. Never removed by any Feat (Law.Humility).")

; ---- Immutable laws (section 4.5, DT_Rules.ImmutableLaws) ------------------
+GameplayTagList=(Tag="Law.Judgment",DevComment="Every chronicle is read at the end.")
+GameplayTagList=(Tag="Law.Sabbath",DevComment="No production multiplier can nullify sabbath, jubilee or grace events.")
+GameplayTagList=(Tag="Law.Humility",DevComment="No Feat can remove the Way.Seized tag.")
+GameplayTagList=(Tag="Law.Remnant",DevComment="Law of the remnant: Hazard.Claim never spawns on a civilization's last system outside any sphere (1 Kings 19:18). Total loss is structurally impossible. Section 4.2, 4.5.")


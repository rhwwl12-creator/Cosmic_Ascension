; Cosmic Ascension - GameplayTag declarations (guideline.md section 10.1, 10.4).
; Rules: Domain.Sub.Leaf, max 3 levels. Tags are declared here and requested in code with
; FGameplayTag::RequestGameplayTag(FName("Hazard.PreSupernova")).
; DevComment is developer-facing only (ASCII). Player-facing names live in DataTables / String Tables.

; Format verified against UE 5.8.3 source (GameplayTagsSettings.h / GameplayTagsManager.cpp):
;  - this file is a config hierarchy layer, so every array row MUST start with '+' (a bare key would replace the array)
;  - loose per-system files under Config/Tags/*.ini use section [/Script/GameplayTags.GameplayTagsList] and bare rows WITHOUT '+'
;  - ImportTagsFromConfig defaults to true; kept explicit to document intent

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True

; ---- Hazards (section 4.1) -------------------------------------------------
+GameplayTagList=(Tag="Hazard.PreSupernova",DevComment="Pre-supernova star. 300 ticks. Unresolved: system destroyed, neighbours damaged.")
+GameplayTagList=(Tag="Hazard.AIAwakening",DevComment="Mining AI awakening. 150 ticks. Unresolved: 50% production +150% / 50% revolt.")
+GameplayTagList=(Tag="Hazard.Plague",DevComment="Interstellar plague. 200 ticks. Unresolved: population -40%, spreads to neighbours.")
+GameplayTagList=(Tag="Hazard.SubspaceErosion",DevComment="Subspace erosion. 400 ticks. Unresolved: lanes permanently cut.")
+GameplayTagList=(Tag="Hazard.Extinction",DevComment="Extinction crisis. 250 ticks. Unresolved: civilization deleted.")
+GameplayTagList=(Tag="Hazard.Cult",DevComment="Cult of a Fallen Transcendent appears. 350 ticks. Unresolved: system joins its sphere.")
+GameplayTagList=(Tag="Hazard.Rebellion",DevComment="Rebellion at the ruler's home system. 200 ticks. Spawns after Stability < 0.3 for 100 ticks (tick >= 300). Unresolved: DeposeRuler.")
+GameplayTagList=(Tag="Hazard.Visitation",DevComment="Visitation (calling). 120 ticks. Not a crisis: unresolved means 'the time passed', no penalty. Section 4.5.")


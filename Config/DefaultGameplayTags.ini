; ---- Revelation modes (section 5.11, FCivArchetypeDef.RevelationMode) ------
; One author, many responses (Heb 1:1). Every archetype row has exactly one mode. Modes change text only, never numbers.
+GameplayTagList=(Tag="Revelation.Book",DevComment="A book exists; a few read it, many only quote it. Templates in passive voice, no scripture text. No row since arch_terran retired in A0 (step 7 decides its row).")
+GameplayTagList=(Tag="Revelation.OtherVoice",DevComment="arch_swarm: a voice inside the swarm that no mouth produced (Num 22:28, John 10:16).")
+GameplayTagList=(Tag="Revelation.Remainder",DevComment="arch_machine: the remainder left when every computation ends (Eccl 3:11, Rom 11:33).")
+GameplayTagList=(Tag="Revelation.Quiet",DevComment="arch_psionic: the quiet behind the noise, measured but unrecorded (Ps 46:10). Vocabulary kept apart from Doctrine.Silence.")
+GameplayTagList=(Tag="Revelation.Debt",DevComment="arch_merchant: a ledger line that does not balance - a debt too large, and already paid (Matt 18:24-27).")
+GameplayTagList=(Tag="Revelation.KeptCovenant",DevComment="arch_covenant: presence as continuity - a promise unbroken for one more generation (Deut 7:9).")
+GameplayTagList=(Tag="Revelation.Seeking",DevComment="Default AI civ: an altar without a name, hands that keep searching (Acts 17:23). Section 5.11.")
+GameplayTagList=(Tag="Revelation.Pillar",DevComment="EA ark-pilgrim diaspora: a pillar that is not on the map (Ex 13:21-22). Phase 6+ row.")
+GameplayTagList=(Tag="Revelation.Whisper",DevComment="EA hermit monastic republic: a wind heard when words are few (1 Kings 19:12). Phase 6+ row.")
+GameplayTagList=(Tag="Revelation.SparedEnemy",DevComment="EA iron legion dynasty: an enemy spared against the law and no one could punish it (2 Kings 6:22). Phase 6+ row.")
+GameplayTagList=(Tag="Revelation.SealedWord",DevComment="EA reliquary wardens: a sound inside a seal that was never opened (Dan 12:4, Rev 5:1-5). Phase 6+ row.")
+GameplayTagList=(Tag="Revelation.Scattering",DevComment="EA Babel concord: one morning they no longer understood each other (Gen 11:8). Phase 6+ row.")

; ---- Dedication banks (section 8.6, DedicationBank column, DT_Dedications) -
; Names given by people after an event, never names God calls himself. Other banks (Machine, Ascetic...) are added when written (Phase 6+).
+GameplayTagList=(Tag="Faith.Bank.Hebrew",DevComment="Congregation / covenant bank: altar-name pattern (Jireh, Nissi, Shalom, Shammah, Roi, Olam, Marah) and the confession 'gathered, we believe; not one name erased'. Used by arch_covenant, and by the Elders of the first life's people once the word has arrived (step 7).")
+GameplayTagList=(Tag="Faith.Bank.Civic",DevComment="Council bank of arch_seeker: republic, union, charter. Secular majority speaker of Trait.Society.Divided.")
+GameplayTagList=(Tag="Faith.Bank.Nations",DevComment="Names of the nations: only titles used by gentiles in Scripture (Most High, Lord of heaven and earth, God of heaven, God of gods, unknown god). Used by civs with Trait.Faith.Seeking. Section 4.5.")

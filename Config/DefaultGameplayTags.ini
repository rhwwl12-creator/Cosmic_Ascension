; ---- Notable persons (section 7.2 FCivilizationState.Notables) ----
; Role tags of FNotableRecord (5 fields: Role, NameIndex, FirstTick, LastTick, SourceRow). Function words, never titles.
; Records are created only by rows carrying EEffectType::NameNotable plus three code hooks, and closed only by those hooks or civ deletion.
; Never for: enc_messenger_* rows, Event.Grace.* rows, Hazard.Cult rows, Transcendents, the player vessel, civs of Tier 4+, civs with an empty PersonNameBank. Section 1.3, 8.3, 12.2.
+GameplayTagList=(Tag="Notable.Ruler",DevComment="Role: ruler who took the throne. Set when Hazard.Rebellion expires and the throne changes: the open Rebel record's Role becomes Ruler (an AI civ, or the player's civ when the rebellion's own DeposeRuler is the recorded effect); the open Ruler and Regent records of that civ close first. Not set when another source recorded the vessel's leaving first (B1: the Rebel record closes instead). Closed by BecomeRuler (a coronation or a return, B1) and by the next rebellion expiry that changes the throne. Never seeded by NewGalaxy. Section 4.1, 5.10, 7.2.")
+GameplayTagList=(Tag="Notable.Regent",DevComment="Role: regent left in charge. Created by the abdication pipeline (B1): the tenth stage's AbdicateRuler calls BecomeWanderer with Reign.Abdicated, whose notable hook 1 opens it under the NameNotable guards (source row log_throne_vacated). Reign.Died uses the same hook (B5: the tenth stage's Die calls ReleaseThrone with Reign.Died; source row = the KillPlayer record's PendingSourceRow). Never with Reign.Deposed (the Rebel holds the throne). Closed by BecomeRuler (a coronation or a return) and by a rebellion expiry that changes the throne. Section 5.10, 7.5.")
+GameplayTagList=(Tag="Notable.Rebel",DevComment="Role: rebellion leader. Created when crisis_rebellion spawns (the single Severity 1 exception, so the 50-tick petition can name him). Expiry: Role becomes Notable.Ruler when the throne changes; record closed when another source recorded the vessel's leaving first (B1, log_rebellion_unseated). Resolution: record closed, no fate told. Section 4.1, 7.2.")
+GameplayTagList=(Tag="Notable.Loyalist",DevComment="Role: loyalist who secretly gave the deposed ruler a ship (exile first-encounter variant). Created in FormerCivID. Condition CivHasNotable for the reunion variants 'recognizes / hides you'. Phase 4. Section 5.10.")
+GameplayTagList=(Tag="Notable.Hearer",DevComment="One who heard: created by resolving Hazard.Visitation or the book-found event. Never 'prophet'. Section 4.5, 5.11.")
+GameplayTagList=(Tag="Notable.Ascendant",DevComment="One who crossed first: created when an AI civ reaches Tier 3 (UAscensionSubsystem AI judgment). Not created at Tier 4 or above (owner civ Tier <= 3 guard). Section 4.3, 7.5.")

; ---- Stances and treaties (B3, section 5.5) --------------------------------
+GameplayTagList=(Tag="Stance.Friendly",DevComment="A people's friendly stance toward another (FCosmicTie.Stance). The ruler's only: it costs Influence upkeep and a friendly slot; the AI holds none. Raises the other people's drift target toward this one. B3.")
+GameplayTagList=(Tag="Stance.Hostile",DevComment="A people's hostile stance toward another (FCosmicTie.Stance) - the gate of a siege. The ruler sets it from the second tier, never under a non-aggression treaty; an AI holds it only while it besieges. B3.")
+GameplayTagList=(Tag="Treaty.Trade",DevComment="Trade treaty of a pair (FCosmicTie.Treaties on both peoples): Influence income per tick and a drift-target term. From the second tier; broken when either side turns hostile. B3.")
+GameplayTagList=(Tag="Treaty.NonAggression",DevComment="Non-aggression treaty of a pair (FCosmicTie.Treaties on both peoples): neither may turn hostile while it stands. From the second tier; the AI never breaks it. B3.")

; ---- Log categories (section 8.1) ------------------------------------------
+GameplayTagList=(Tag="Log.Civ",DevComment="Civilization life: economy, research, population.")
+GameplayTagList=(Tag="Log.Crisis",DevComment="Hazard spawned / expired / resolved.")
+GameplayTagList=(Tag="Log.Conflict",DevComment="Sieges the people the player rules is a party to (B3, rows log_siege_* in Tools/data/DT_LogTemplates.json): one its command began (Severity 1, no auto-pause), another people besieging one of its systems (2), the four ends of a siege drawn at its end - taken, lost, held, failed (2) - and a siege lifted without a judgment when its gate is refused (1 - one refused at its end tick has drawn its number, which is thrown away). One row per side; the other people is met before the line. Sieges between AI peoples are not told. And the ruled people's fleet worn by a higher sphere at its target's first conflict stage (B4, log_fleet_worn, Severity 1; AI fleets are not told). Section 8.3.")
+GameplayTagList=(Tag="Log.Discovery",DevComment="Research breakthroughs, relics, scans.")
+GameplayTagList=(Tag="Log.Ascension",DevComment="Tier changes and Mythic Feats. Severity 2 candidates.")
+GameplayTagList=(Tag="Log.Transcendent",DevComment="Fallen Transcendent speech. Written in first person.")
+GameplayTagList=(Tag="Log.Sign",DevComment="Signs seen by Tier 1-2 peoples. Metaphor voice, no explanation. Section 8.2 speaker layers.")
+GameplayTagList=(Tag="Log.Calling",DevComment="The calling and the vessel's role: the first life, an enthronement, a return, an abdication, a deposition (B1), a death and an inauguration (B5 - by the vessel's name, third person). The interregnum has no line of its own (B5 header 2.7); the return lure's lines wait for section 16 #146. Section 4.4.")
+GameplayTagList=(Tag="Log.Claim",DevComment="Fallen Transcendent claims a system in first person: told when a Hazard.Claim expires and the system joins the sphere (the transcendent row's ClaimTemplates, B4). Severity 1, told from the third rung (MinViewerTier 3) and kept untold below it, where the sign told just before it (log_sign_claim, Log.Sign) is what is read. No cooldown key (B4 decision 6). No event row speaks it (schema). Always moved into the Chronicle (Two Books chapter). Section 4.2, 8.4.")
+GameplayTagList=(Tag="Log.Record",DevComment="Narrator's record of a people's irreversible loss - a settled system destroyed, a system annexed by a claim - for every people whatever its faith traits: 'was recorded' (subjectless passive) about a place or an event, {System} alone, no numbers. Kept untold whatever the scope (never in the feed). First part of the Two Books chapter; always moved into the Chronicle. Section 4.2, 8.3, 8.4; B5 decision 11.")

